<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>To-Do List</h1>

      <div class="input-section">
        <input type="text" id="taskInput" placeholder="Masukkan tugas..." />
        <button id="addButton">Tambah</button>
      </div>

      <ul id="taskList"></ul>

      <div class="statistics">
        <div>
          <span id="totalTasks">0</span>
          <p>Total Tugas</p>
        </div>

        <div>
          <span id="completedTasks">0</span>
          <p>Selesai</p>
        </div>

        <div>
          <span id="pendingTasks">0</span>
          <p>Belum Selesai</p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
